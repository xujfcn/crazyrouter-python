[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crazyrouter"
version = "1.0.0"
description = "Official Python SDK for Crazyrouter — One API key for 300+ AI models. Drop-in replacement for OpenAI Python SDK."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Crazyrouter", email = "support@crazyrouter.com"}]
keywords = ["ai", "api", "openai", "claude", "gemini", "deepseek", "gpt-5", "llm", "ai-gateway", "sdk", "crazyrouter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["openai>=1.0.0"]

[project.urls]
Homepage = "https://crazyrouter.com"
Documentation = "https://crazyrouter.com/docs"
Repository = "https://github.com/xujfcn/crazyrouter-python"
Issues = "https://github.com/xujfcn/crazyrouter-python/issues"
